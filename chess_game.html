<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы - Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        .game-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .current-turn {
            background: rgba(46, 204, 113, 0.3);
            border: 2px solid #2ecc71;
        }
        
        .chess-board {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid #8b4513;
            background: #d4a574;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3vw;
            cursor: pointer;
            position: relative;
            user-select: none;
            overflow: visible;
        }
        
        .square.light {
            background: #f0d9b5;
        }
        
        .square.dark {
            background: #b58863;
        }
        
        .square.selected {
            background: #f7f769 !important;
            box-shadow: inset 0 0 0 3px #ffd700;
        }
        
        .square.possible-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .square.possible-capture {
            background: rgba(255, 107, 107, 0.3) !important;
        }
        
        .square.possible-capture::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border: 3px solid rgba(255, 107, 107, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .piece {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4vw;
            cursor: pointer;
            user-select: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .game-over.show {
            display: flex;
        }
        
        .game-over-content {
            background: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
        }
        
        .game-over-content h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .find-player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .find-player-overlay.show {
            display: flex;
        }
        
        .find-player-content {
            background: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        
        .find-player-content h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .find-player-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        
        .find-player-content input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        @media (max-width: 600px) {
            .piece {
                font-size: 5vw;
            }
            .square {
                font-size: 4vw;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <div class="player-info" id="whitePlayer">
                <div>⚪ Белые</div>
                <div id="whiteTime">--:--</div>
            </div>
            <div class="player-info" id="blackPlayer">
                <div>⚫ Черные</div>
                <div id="blackTime">--:--</div>
            </div>
        </div>
        
        <div class="chess-board" id="chessBoard"></div>
        
        <div class="controls">
            <button onclick="resign()">Сдаться</button>
            <button onclick="offerDraw()">Предложить ничью</button>
            <button onclick="resetGame()">Новая игра</button>
            <button id="findPlayerBtn" onclick="showFindPlayerOverlay()" style="display: none;">👥 Играть один на один</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 id="gameOverText">Игра окончена</h2>
            <button onclick="resetGame()">Новая игра</button>
        </div>
    </div>
    
    <div class="find-player-overlay" id="findPlayerOverlay">
        <div class="find-player-content">
            <h2>👥 Играть один на один</h2>
            <p style="font-size: 12px; margin-bottom: 10px; color: rgba(255,255,255,0.7);">
                ⚠️ Важно: второй игрок тоже должен открыть игру через бота (нажать "Играть один на один"), чтобы его можно было найти.
            </p>
            <p>Введите username игрока (без @)</p>
            <input type="text" id="playerUsernameInput" placeholder="username" autocomplete="off">
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button onclick="findPlayerByUsername()">🔍 Найти игрока</button>
                <button onclick="closeFindPlayerOverlay()">❌ Закрыть</button>
            </div>
        </div>
    </div>
    
    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // Шахматная доска и состояние игры
        let board = [];
        let currentPlayer = 'white';
        let selectedSquare = null;
        let gameMode = 'bot'; // 'bot', 'pvp', 'online'
        let gameSessionId = null;
        let moveCount = 0;
        let gameOver = false;
        let myPlayerNumber = null; // 1 или 2 для онлайн-игры
        let myColor = 'white'; // 'white' или 'black' для онлайн-игры
        let isMyTurn = true;
        
        // Unicode символы для фигур
        const pieces = {
            white: {
                king: '♔',
                queen: '♕',
                rook: '♖',
                bishop: '♗',
                knight: '♘',
                pawn: '♙'
            },
            black: {
                king: '♚',
                queen: '♛',
                rook: '♜',
                bishop: '♝',
                knight: '♞',
                pawn: '♟'
            }
        };
        
        // Инициализация доски
        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            
            // Расставляем фигуры
            const initialSetup = [
                ['rook', 'knight', 'bishop', 'queen', 'king', 'bishop', 'knight', 'rook'],
                ['pawn', 'pawn', 'pawn', 'pawn', 'pawn', 'pawn', 'pawn', 'pawn']
            ];
            
            // Черные фигуры (верх)
            for (let col = 0; col < 8; col++) {
                board[0][col] = { type: initialSetup[0][col], color: 'black' };
                board[1][col] = { type: initialSetup[1][col], color: 'black' };
            }
            
            // Белые фигуры (низ)
            for (let col = 0; col < 8; col++) {
                board[6][col] = { type: initialSetup[1][col], color: 'white' };
                board[7][col] = { type: initialSetup[0][col], color: 'white' };
            }
            
            renderBoard();
        }
        
        // Отрисовка доски
        function renderBoard() {
            const boardElement = document.getElementById('chessBoard');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = row;
                    square.dataset.col = col;
                    
                    const piece = board[row][col];
                    if (piece) {
                        const pieceElement = document.createElement('div');
                        pieceElement.className = 'piece';
                        pieceElement.textContent = pieces[piece.color][piece.type];
                        square.appendChild(pieceElement);
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(row, col));
                    boardElement.appendChild(square);
                }
            }
            
            updatePlayerInfo();
        }
        
        // Обработка клика по клетке
        function handleSquareClick(row, col) {
            if (gameOver) return;
            
            // В онлайн-режиме проверяем, что это ход игрока
            if (gameMode === 'online' && gameSessionId) {
                if (!isMyTurn) {
                    alert('Сейчас не ваш ход! Дождитесь хода противника.');
                    return;
                }
                if (currentPlayer !== myColor) {
                    alert('Сейчас не ваш ход!');
                    return;
                }
            }
            
            const piece = board[row][col];
            
            if (selectedSquare) {
                const [selectedRow, selectedCol] = selectedSquare;
                const selectedPiece = board[selectedRow][selectedCol];
                
                // Если кликнули на свою фигуру, выбираем её
                if (piece && piece.color === currentPlayer) {
                    selectSquare(row, col);
                    return;
                }
                
                // Пытаемся сделать ход
                if (isValidMove(selectedRow, selectedCol, row, col)) {
                    makeMove(selectedRow, selectedCol, row, col);
                    selectedSquare = null;
                    renderBoard();
                    
                    // Если игра против бота и ход черных
                    if (gameMode === 'bot' && currentPlayer === 'black') {
                        setTimeout(makeBotMove, 500);
                    }
                } else {
                    // Если ход невалидный, снимаем выделение или выбираем новую фигуру
                    if (piece && piece.color === currentPlayer) {
                        selectSquare(row, col);
                    } else {
                        selectedSquare = null;
                        renderBoard();
                    }
                }
            } else {
                // Выбираем фигуру
                if (piece && piece.color === currentPlayer) {
                    selectSquare(row, col);
                }
            }
        }
        
        // Выбор клетки
        function selectSquare(row, col) {
            selectedSquare = [row, col];
            renderBoard();
            
            // Подсвечиваем выбранную клетку
            const square = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (square) {
                square.classList.add('selected');
            }
            
            // Подсвечиваем возможные ходы
            highlightPossibleMoves(row, col);
        }
        
        // Подсветка возможных ходов
        function highlightPossibleMoves(row, col) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (isValidMove(row, col, r, c)) {
                        const square = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                        if (square) {
                            if (board[r][c]) {
                                square.classList.add('possible-capture');
                            } else {
                                square.classList.add('possible-move');
                            }
                        }
                    }
                }
            }
        }
        
        // Проверка валидности хода (упрощенная версия)
        function isValidMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (!piece) return false;
            
            // Нельзя ходить на свою фигуру
            if (board[toRow][toCol] && board[toRow][toCol].color === piece.color) {
                return false;
            }
            
            // Упрощенная логика ходов (базовая версия)
            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);
            
            switch (piece.type) {
                case 'pawn':
                    if (piece.color === 'white') {
                        // Белые пешки ходят вверх
                        if (fromCol === toCol && !board[toRow][toCol]) {
                            return toRow === fromRow - 1 || (fromRow === 6 && toRow === 4);
                        }
                        // Взятие по диагонали
                        if (colDiff === 1 && rowDiff === 1 && board[toRow][toCol]) {
                            return toRow === fromRow - 1;
                        }
                    } else {
                        // Черные пешки ходят вниз
                        if (fromCol === toCol && !board[toRow][toCol]) {
                            return toRow === fromRow + 1 || (fromRow === 1 && toRow === 3);
                        }
                        // Взятие по диагонали
                        if (colDiff === 1 && rowDiff === 1 && board[toRow][toCol]) {
                            return toRow === fromRow + 1;
                        }
                    }
                    return false;
                    
                case 'rook':
                    return (rowDiff === 0 || colDiff === 0) && isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'bishop':
                    return rowDiff === colDiff && isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'queen':
                    return ((rowDiff === 0 || colDiff === 0) || (rowDiff === colDiff)) && 
                           isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'king':
                    return rowDiff <= 1 && colDiff <= 1;
                    
                case 'knight':
                    return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
                    
                default:
                    return false;
            }
        }
        
        // Проверка свободного пути
        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : (toRow < fromRow ? -1 : 0);
            const colStep = toCol > fromCol ? 1 : (toCol < fromCol ? -1 : 0);
            
            let row = fromRow + rowStep;
            let col = fromCol + colStep;
            
            while (row !== toRow || col !== toCol) {
                if (board[row][col]) return false;
                row += rowStep;
                col += colStep;
            }
            
            return true;
        }
        
        // Выполнение хода
        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const capturedPiece = board[toRow][toCol];
            
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;
            
            moveCount++;
            
            // Проверка на мат (упрощенная)
            if (isCheckmate(currentPlayer === 'white' ? 'black' : 'white')) {
                endGame(currentPlayer === 'white' ? 'white' : 'black', 'checkmate');
                return;
            }
            
            // Отправка хода боту (если нужно)
            if (tg && tg.sendData) {
                const moveFrom = `${String.fromCharCode(97 + fromCol)}${8 - fromRow}`;
                const moveTo = `${String.fromCharCode(97 + toCol)}${8 - toRow}`;
                
                if (gameMode === 'online') {
                    // Отправляем ход для синхронизации с другим игроком
                    tg.sendData(JSON.stringify({
                        action: 'make_move',
                        sessionId: gameSessionId,
                        from: moveFrom,
                        to: moveTo,
                        boardState: board,
                        currentPlayer: currentPlayer === 'white' ? 'black' : 'white'
                    }));
                    
                    // Блокируем ходы до получения ответа от противника
                    isMyTurn = false;
                } else {
                    // Сохраняем ход в БД
                    tg.sendData(JSON.stringify({
                        action: 'save_move',
                        sessionId: gameSessionId,
                        moveNumber: moveCount,
                        playerId: currentPlayer === 'white' ? 1 : 2,
                        moveFrom: moveFrom,
                        moveTo: moveTo,
                        piece: piece.type,
                        capturedPiece: capturedPiece ? capturedPiece.type : null
                    }));
                }
            }
            
            // Смена хода
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
        }
        
        // Применение хода от противника (для онлайн-игры)
        function applyOpponentMove(fromPos, toPos, newBoardState) {
            if (gameMode !== 'online') return;
            
            // Парсим позиции (например, "e2" -> row=6, col=4)
            const fromCol = fromPos.charCodeAt(0) - 97;
            const fromRow = 8 - parseInt(fromPos[1]);
            const toCol = toPos.charCodeAt(0) - 97;
            const toRow = 8 - parseInt(toPos[1]);
            
            // Применяем ход
            if (newBoardState) {
                // Восстанавливаем доску из состояния
                board = newBoardState;
            } else {
                // Применяем ход вручную
                const piece = board[fromRow][fromCol];
                board[toRow][toCol] = piece;
                board[fromRow][fromCol] = null;
            }
            
            // Смена хода
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            isMyTurn = true;
            moveCount++;
            
            renderBoard();
        }
        
        // Ход бота (случайный валидный ход)
        function makeBotMove() {
            if (gameOver || currentPlayer !== 'black') return;
            
            const possibleMoves = [];
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.color === 'black') {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(row, col, toRow, toCol)) {
                                    possibleMoves.push([row, col, toRow, toCol]);
                                }
                            }
                        }
                    }
                }
            }
            
            if (possibleMoves.length > 0) {
                const move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                makeMove(move[0], move[1], move[2], move[3]);
                renderBoard();
            }
        }
        
        // Проверка на мат (упрощенная)
        function isCheckmate(color) {
            // Упрощенная проверка - если король под ударом и нет ходов
            // В реальной игре нужна более сложная логика
            return false;
        }
        
        // Обновление информации об игроках
        function updatePlayerInfo() {
            const whitePlayer = document.getElementById('whitePlayer');
            const blackPlayer = document.getElementById('blackPlayer');
            
            whitePlayer.classList.toggle('current-turn', currentPlayer === 'white');
            blackPlayer.classList.toggle('current-turn', currentPlayer === 'black');
        }
        
        // Сдача
        function resign() {
            if (gameOver) return;
            endGame(currentPlayer === 'white' ? 'black' : 'white', 'resign');
        }
        
        // Предложение ничьей
        function offerDraw() {
            if (gameOver) return;
            if (confirm('Предложить ничью?')) {
                endGame(null, 'draw');
            }
        }
        
        // Новая игра
        function resetGame() {
            gameOver = false;
            currentPlayer = 'white';
            selectedSquare = null;
            moveCount = 0;
            document.getElementById('gameOver').classList.remove('show');
            initBoard();
        }
        
        // Завершение игры
        function endGame(winner, reason) {
            gameOver = true;
            const gameOverElement = document.getElementById('gameOver');
            const gameOverText = document.getElementById('gameOverText');
            
            let message = '';
            if (reason === 'checkmate') {
                message = `Мат! Победили ${winner === 'white' ? 'белые' : 'черные'}!`;
            } else if (reason === 'resign') {
                message = `Игрок сдался. Победили ${winner === 'white' ? 'белые' : 'черные'}!`;
            } else if (reason === 'draw') {
                message = 'Ничья!';
            }
            
            gameOverText.textContent = message;
            gameOverElement.classList.add('show');
            
            // Отправка результата боту
            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify({
                    action: 'save_game',
                    sessionId: gameSessionId,
                    winnerId: winner === 'white' ? 1 : (winner === 'black' ? 2 : null),
                    result: reason === 'draw' ? 'draw' : 'win',
                    movesCount: moveCount,
                    gameMode: gameMode
                }));
            }
        }
        
        // Функции для поиска игрока
        function isTelegramWebApp() {
            return typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp;
        }
        
        function showFindPlayerOverlay() {
            if (!isTelegramWebApp() || !tg || !tg.sendData) {
                alert('⚠️ Поиск игрока доступен только в Telegram WebApp.\n\nОткройте игру через бота в Telegram.');
                return;
            }
            
            const overlay = document.getElementById('findPlayerOverlay');
            if (overlay) {
                overlay.classList.add('show');
                const input = document.getElementById('playerUsernameInput');
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }
        
        function closeFindPlayerOverlay() {
            const overlay = document.getElementById('findPlayerOverlay');
            if (overlay) {
                overlay.classList.remove('show');
            }
        }
        
        function findPlayerByUsername() {
            const input = document.getElementById('playerUsernameInput');
            if (!input) {
                console.error('❌ Поле ввода username не найдено');
                return;
            }
            
            const username = input.value.trim();
            if (!username) {
                alert('Введите username игрока');
                return;
            }
            
            if (!tg || !tg.sendData) {
                alert('Поиск игрока доступен только в Telegram WebApp');
                console.error('❌ Telegram WebApp API недоступен');
                return;
            }
            
            // Сначала регистрируем игрока, чтобы он был в списке активных
            console.log('📝 Регистрируем игрока перед поиском...');
            registerPlayer();
            
            // Небольшая задержка перед отправкой запроса на поиск
            setTimeout(() => {
                const searchData = {
                    action: 'find_player_by_username',
                    username: username
                };
                
                console.log('🔍 Отправляем запрос на поиск игрока:', searchData);
                
                try {
                    tg.sendData(JSON.stringify(searchData));
                    console.log('✅ Запрос отправлен успешно');
                } catch (e) {
                    console.error('❌ Ошибка отправки запроса:', e);
                    alert('Ошибка отправки запроса. Попробуйте еще раз.');
                    return;
                }
                
                closeFindPlayerOverlay();
                
                // Показываем сообщение о поиске
                const gameContainer = document.querySelector('.game-container');
                if (gameContainer) {
                    gameContainer.style.display = 'flex';
                }
                
                alert('Поиск игрока... Проверьте сообщения от бота. После того как игрок будет найден, нажмите кнопку в сообщении от бота, чтобы начать игру.');
            }, 500);
        }
        
        // Регистрация игрока как активного
        function registerPlayer() {
            if (tg && tg.sendData && isTelegramWebApp()) {
                try {
                    const data = {
                        action: 'register_player'
                    };
                    // Если есть сессия, отправляем её ID
                    if (gameSessionId) {
                        data.sessionId = gameSessionId;
                    }
                    const dataStr = JSON.stringify(data);
                    console.log('📝 Регистрируем игрока:', dataStr);
                    tg.sendData(dataStr);
                    console.log('✅ Игрок зарегистрирован как активный', gameSessionId ? `(сессия: ${gameSessionId})` : '');
                } catch (e) {
                    console.error('❌ Ошибка регистрации игрока:', e);
                }
            } else {
                console.warn('⚠️ Telegram WebApp недоступен для регистрации');
            }
        }
        
        // Обновление регистрации игрока (периодически)
        function updatePlayerRegistration() {
            if (gameMode === 'online') {
                registerPlayer();
            }
        }
        
        // Обработка сообщений от бота
        function handleBotMessage(messageText) {
            try {
                const data = JSON.parse(messageText);
                
                if (data.type === 'opponent_move' && data.sessionId === gameSessionId) {
                    // Получен ход от противника
                    applyOpponentMove(data.from, data.to, data.boardState);
                } else if (data.type === 'game_state' && data.sessionId === gameSessionId) {
                    // Получено состояние игры
                    if (data.boardState) {
                        board = data.boardState;
                        currentPlayer = data.currentPlayer || 'white';
                        isMyTurn = (currentPlayer === myColor);
                        renderBoard();
                    }
                }
            } catch (e) {
                console.error('Ошибка обработки сообщения от бота:', e);
            }
        }
        
        // Инициализация игры
        function init() {
            // Получаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            gameMode = urlParams.get('mode') || 'bot';
            gameSessionId = urlParams.get('session') || null;
            myPlayerNumber = urlParams.get('player') ? parseInt(urlParams.get('player')) : null;
            myColor = urlParams.get('color') || 'white';
            const findPlayer = urlParams.get('find_player') === 'true';
            
            // Если нужно показать overlay поиска игрока
            if (findPlayer && gameMode === 'online' && !gameSessionId) {
                // Показываем overlay для поиска игрока
                setTimeout(() => {
                    showFindPlayerOverlay();
                }, 500);
                // Не инициализируем игру, пока игрок не найдет соперника
                registerPlayer();
                // Скрываем доску, пока не найдем соперника
                const gameContainer = document.querySelector('.game-container');
                if (gameContainer) {
                    gameContainer.style.display = 'none';
                }
                // Инициализируем пустую доску (чтобы не было ошибок)
                initBoard();
                return;
            }
            
            // Показываем доску, если она была скрыта
            const gameContainer = document.querySelector('.game-container');
            if (gameContainer) {
                gameContainer.style.display = 'flex';
            }
            
            // Если нет сессии в онлайн-режиме, это ошибка - переключаемся на локальный режим
            if (gameMode === 'online' && !gameSessionId) {
                console.warn('Онлайн-режим без сессии, переключаемся на локальный режим');
                gameMode = 'pvp';
                gameSessionId = 'session_' + Date.now();
            } else if (!gameSessionId) {
                gameSessionId = 'session_' + Date.now();
            }
            
            // Если есть состояние доски в URL (для онлайн-игры)
            const boardStateParam = urlParams.get('boardState');
            if (boardStateParam && gameMode === 'online') {
                try {
                    board = JSON.parse(decodeURIComponent(boardStateParam));
                } catch (e) {
                    console.error('Ошибка парсинга состояния доски:', e);
                    initBoard();
                }
            } else {
                initBoard();
            }
            
            // Регистрируем игрока
            registerPlayer();
            
            // Показываем кнопку поиска игрока только в онлайн-режиме БЕЗ активной сессии
            const findPlayerBtn = document.getElementById('findPlayerBtn');
            if (findPlayerBtn) {
                if (gameMode === 'online' && isTelegramWebApp() && !gameSessionId) {
                    findPlayerBtn.style.display = 'inline-block';
                } else {
                    findPlayerBtn.style.display = 'none';
                }
            }
            
            // В онлайн-режиме с сессией определяем, чей ход
            if (gameMode === 'online' && gameSessionId && myColor) {
                isMyTurn = (currentPlayer === myColor);
            }
            
            // Настраиваем обработчик сообщений от бота
            if (tg && tg.onEvent) {
                tg.onEvent('message', (data) => {
                    if (data && data.text) {
                        handleBotMessage(data.text);
                    }
                });
            }
            
            // Периодически обновляем регистрацию игрока
            if (gameMode === 'online') {
                setInterval(updatePlayerRegistration, 30000); // Каждые 30 секунд
            }
            
            // Обработка Enter в поле поиска игрока
            const usernameInput = document.getElementById('playerUsernameInput');
            if (usernameInput) {
                usernameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        findPlayerByUsername();
                    }
                });
            }
        }
        
        // Запуск при загрузке
        init();
    </script>
</body>
</html>
